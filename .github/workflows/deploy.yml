name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
      - name: Verify albums and public artifact
        run: node scripts/validate-artifact.mjs

      - name: Install fixed browser engines
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Verify production artifact core flows
        env:
          BROWSERS: chromium,firefox
        run: pnpm test:browser

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-browser-evidence
          path: browser-results
          retention-days: 14

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  webkit-media:
    # WebKit media codecs depend on the OS; official Playwright guidance recommends macOS for video.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and validate public artifact
        run: pnpm build && node scripts/validate-artifact.mjs
      - name: Install fixed native WebKit engine
        run: pnpm exec playwright install webkit
      - name: WebKit core flows and real MP4 playback
        env:
          BROWSERS: webkit
        run: pnpm test:browser
      - name: Preserve WebKit media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-webkit-media-evidence
          path: browser-results
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, webkit-media]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
