name: 檢查維修 Excel

on:
  push:
    branches: [main]
    paths: ['date/**', '.github/workflows/check-repair-excel.yml']
  pull_request:
    paths: ['date/**', '.github/workflows/check-repair-excel.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: Campcool/TITAN-STAR
          ref: main
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝固定版本依賴
        working-directory: engine
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: 檢查全部月份（不寫入原始資料）
        run: node engine/scripts/check-source-dir.cjs source/date
